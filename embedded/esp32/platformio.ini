; PlatformIO Project Configuration for BOW ROBOT ESP32 Firmware
; Compatible with ESP32-WROOM-32 and ESP32-S3

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32 @ ^6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    madhephaestus/ESP32Servo @ ^1.1.1
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.3

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM=0

[env:esp32s3]
platform = espressif32 @ ^6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    madhephaestus/ESP32Servo @ ^1.1.1
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.3

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
